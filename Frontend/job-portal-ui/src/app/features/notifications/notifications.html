<h2>Notifications</h2>

<p *ngIf="loading">Loading...</p>
<p class="empty" *ngIf="!loading && items.length === 0">No notifications yet.</p>

<div class="list">
    <div class="card item" *ngFor="let n of items" [class.unread]="!n.is_read">
        <div>
            <strong>{{ n.title }}</strong>
            <p class="sub">{{ n.company }} · {{ n.created_at | date: 'medium' }}</p>
        </div>
        <button class="btn" *ngIf="!n.is_read" (click)="read(n)">Mark read</button>
    </div>
</div>
